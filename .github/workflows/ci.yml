name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks, tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # `tsc -b` covers the packages, the apps and examples/providers. The browser and server
      # examples have their own tsconfigs and are only reached through this script.
      - name: Typecheck the examples
        run: npm run examples:typecheck

      - name: Unit tests and plugin contract
        run: npm run test

      - name: Check core purity
        run: npm run purity

      - name: Build
        run: npm run build

      # The build regenerates two kinds of committed file: each package's `exports` map
      # and the router's route tree. A stale one would otherwise be noticed by whoever
      # installed the package, or not at all.
      - name: Check that generated files are committed
        run: git diff --exit-code

  dist:
    name: Packages resolve as published
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Everyday builds resolve workspace packages through the `@checkout-kit/source` condition and
      # see TypeScript sources, so a broken `exports` map would only surface downstream.
      # This job builds the app the way a published consumer would; publint checks all
      # packages after the build and attw checks their declarations in the next step.
      - name: Build the demo against the packages' published entry points
        run: npm run verify:dist

      - name: Check the published type declarations
        run: npm run check:types

      - name: Install tarballs in a separate consumer and verify types, SSR and checkout
        run: npm run verify:consumer

      - name: Verify the complete release bundle when changesets have been applied
        if: hashFiles('.changeset/*.md') == ''
        run: npm run release:archives

      - name: Upload installable packages
        uses: actions/upload-artifact@v7
        with:
          name: checkout-kit-packages
          path: artifacts/packages/
          retention-days: 14

  docs:
    name: Guides and generated API reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install documentation dependencies
        run: npm run docs:ci
      - name: Build package declarations
        run: npm run build:packages
      - name: Generate API reference
        run: npm run docs:api
      - name: Build the documentation and check links
        run: npm run docs:build

  e2e:
    name: E2E (mock backend)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (app served with the MSW mock)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/demo/playwright-report/
          retention-days: 7

  integration:
    name: E2E (merchant server and provider packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Stripe, Adyen and PayPal flows against the local protocol simulator
        run: npm run test:integration
      - name: Upload integration report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-playwright-report
          path: examples/react/playwright-report/
          retention-days: 7

  ui:
    name: UI (desktop, Android, iOS and 320px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium webkit
      - name: Check component accessibility, keyboard behavior and responsive layouts
        run: npm run test:ui
      - name: Upload UI report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-playwright-report
          path: apps/demo/ui-playwright-report/
          retention-days: 14
