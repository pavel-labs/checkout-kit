name: Publish release archives

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: archive-releases
  cancel-in-progress: false

jobs:
  publish:
    # Only a successful push to this repository's main can supply release files.
    # PR and fork artifacts never enter a job with a write token.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout the exact commit that passed CI
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check whether this version needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (!/^\d+\.\d+\.\d+$/.test(version) || version === '0.0.0') throw new Error('Set the archive release version first.')
          const tag = 'v' + version
          const response = await fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/releases/tags/' + tag, {
            headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json' },
          })
          if (!response.ok && response.status !== 404) throw new Error('Could not check release: HTTP ' + response.status)
          const release = response.ok ? await response.json() : null
          if (release?.draft && release.target_commitish !== process.env.RELEASE_SHA) throw new Error('An existing draft targets a different commit. Resolve that draft before retrying.')
          const required = !release || release.draft
          appendFileSync(process.env.GITHUB_OUTPUT, 'required=' + required + '\ndraft=' + Boolean(release?.draft) + '\nversion=' + version + '\ntag=' + tag + '\nprerelease=' + version.startsWith('0.') + '\n')
          console.log(required ? 'Preparing ' + tag : tag + ' is already published; keeping its assets unchanged.')
          NODE

      - name: Download the package archives tested by this CI run
        if: steps.release.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --name checkout-kit-packages --dir artifacts/packages

      - name: Verify archives and prepare the complete bundle
        if: steps.release.outputs.required == 'true'
        run: node scripts/prepare-release.mjs

      - name: Create a draft at the verified commit
        if: steps.release.outputs.required == 'true' && steps.release.outputs.draft != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: >-
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --draft --target "$RELEASE_SHA" --title "Checkout kit $RELEASE_VERSION"
          --notes-file artifacts/release/README.md --prerelease="$PRERELEASE" --latest=false

      - name: Upload all assets before making the release public
        if: steps.release.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/release/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the complete release
        if: steps.release.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: >-
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          --notes-file artifacts/release/README.md --draft=false
          --prerelease="$PRERELEASE" --latest=false
