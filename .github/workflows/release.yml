name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Verify public npm archives without publishing'
        type: boolean
        default: true
      tag:
        description: 'Distribution tag for newly published versions'
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify public npm release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - name: Check source and payment contracts
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run examples:typecheck
          npm test
          npm run test:release
          npm run purity
      - name: Verify distributable packages and actual installation
        run: |
          npm run verify:dist
          npm run check:types
          npm run verify:consumer
          npm run release:npm-check
          git diff --exit-code
      - uses: actions/upload-artifact@v7
        with:
          name: npm-verified-packages
          path: artifacts/packages/
          retention-days: 14

  publish:
    name: Publish the verified archives using npm OIDC
    if: ${{ !inputs.dry-run }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Require main for public publication
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the archives verified in this workflow run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name npm-verified-packages --dir artifacts/packages
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the exact tested archives
        run: node scripts/publish-npm.mjs --publish --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
